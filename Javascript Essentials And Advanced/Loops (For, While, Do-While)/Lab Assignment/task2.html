<script>
    // Task 2: Sum all even numbers between 1 and 20 using a while loop
        let sum = 0;
        let number = 1;

        while (number <= 20) {
            if (number % 2 === 0) { // Check if the number is even
                sum += number; // Add the even number to the sum
            }
            number++; // Increment the number
        }

        console.log("The sum of all even numbers between 1 and 20 is: " + sum);
</script>
