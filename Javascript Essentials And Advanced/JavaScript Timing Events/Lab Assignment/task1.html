<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Background Color</title>
    <style>
        body {
            transition: background-color 0.5s;
            /* Smooth transition for background color */
        }
    </style>
</head>

<body>

    <h1>Background Color Change Example</h1>
    <p>The background color will change after 5 seconds.</p>

    <script>
        // Function to change the background color
        function changeBackgroundColor() {
            document.body.style.backgroundColor = 'lightblue'; // Change to light blue
        }

        // Set a timeout to change the background color after 5 seconds (5000 milliseconds)
        setTimeout(changeBackgroundColor, 5000);
    </script>

</body>

</html>
