<script>
    // Task 2: Display the day of the week based on user input
        let dayNumber = prompt("Enter a number (1-7) for the day of the week (1 for Sunday, 2 for Monday, etc.):");

        switch (parseInt(dayNumber)) {
            case 1:
                console.log("Sunday");
                break;
            case 2:
                console.log("Monday");
                break;
            case 3:
                console.log("Tuesday");
                break;
            case 4:
                console.log("Wednesday");
                break;
            case 5:
                console.log("Thursday");
                break;
            case 6:
                console.log("Friday");
                break;
            case 7:
                console.log("Saturday");
                break;
            default:
                console.log("Invalid input! Please enter a number between 1 and 7.");
        }
</script>
