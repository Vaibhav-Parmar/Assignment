<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to JavaScript</title>
    <script>
        // JavaScript code to display an alert when the page loads
        window.onload = function () {
            alert("Welcome to JavaScript!");
        };
    </script>
</head>

<body>
    <h1>Hello, World!</h1>
    <p>This is a simple HTML page that demonstrates JavaScript.</p>
    <p>When the page loads, you will see an alert box with a welcome message.</p>
</body>

</html>
