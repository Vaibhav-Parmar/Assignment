<Script>
    // Declare two numbers
        let a = 15;
        let b = 5;

        // Arithmetic Operations
        let sum = a + b;
        let difference = a - b;
        let product = a * b;
        let quotient = a / b;

        console.log("Arithmetic Operations:");
        console.log("Sum: " + sum);
        console.log("Difference: " + difference);
        console.log("Product: " + product);
        console.log("Quotient: " + quotient);

        // Comparison Operations
        let isEqual = (a == b);
        let isGreater = (a > b);

        console.log("\nComparison Operations:");
        console.log("Is a equal to b? " + isEqual);
        console.log("Is a greater than b? " + isGreater);

        // Logical Operations
        let condition1 = (a > 10);
        let condition2 = (b < 5);
        let bothConditions = condition1 && condition2;

        console.log("\nLogical Operations:");
        console.log("Is a > 10 and b < 5? " + bothConditions);
</Script>
