<!-- Create a audio video tag
Also applied properties like muted loop autoplay -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio and Video Tag</title>
</head>

<body>
    <!-- Audio Tag -->
    <audio controls autoplay loop muted>
        <source src="audio.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
    <br>
    <!-- Video Tag -->
    <video width="320" height="240" controls autoplay loop muted>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</body>

</html>

<!-- Create some shape using svg tag in html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Shape</title>
</head>

<body>

    <svg width="200" height="200">
        <rect x="50" y="50" width="150" height="100" fill="blue" />
    </svg>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle Shape</title>
</head>

<body>

    <svg width="200" height="200">
        <!-- Circle with cx=100, cy=100, r=50 -->
        <circle cx="100" cy="100" r="50" fill="green" />
    </svg>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Shape</title>
</head>

<body>

    <svg width="200" height="200">
        <!-- Triangle with three points -->

</html>
